name: CI and container

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nubixor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        env:
          NODE_ENV: test
          CORS_ORIGINS: http://localhost:4100,http://127.0.0.1:4100
          PUBLIC_BASE_URL: http://localhost:4100
        run: npm run check

      - name: Validate Docker Compose
        env:
          APP_DOMAIN: app.nubixor.tech
          POSTGRES_PASSWORD: validation-only-password
          BACKUP_ENCRYPTION_KEY: validation-only-backup-key
          ELECTRONIC_BILLING_ENCRYPTION_KEY: validation-only-billing-key
          PASSWORD_RESET_WEBHOOK_URL: https://example.test/password-reset
          PASSWORD_RESET_WEBHOOK_SECRET: validation-only-webhook-secret
        run: docker compose config --quiet

      - name: Build container
        run: docker build --tag nubixor-api:ci .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nubixor-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
