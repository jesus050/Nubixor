services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: megasuite
      POSTGRES_USER: megasuite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes:
      - megasuite_pg_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megasuite -d megasuite"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - megasuite_redis_v2:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/jesus050/nubixor-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: postgresql://megasuite:${POSTGRES_PASSWORD}@postgres:5432/megasuite
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
      TRUST_PROXY: "true"
      PUBLIC_BASE_URL: https://${APP_DOMAIN:?Configura APP_DOMAIN}
      CORS_ORIGINS: https://${APP_DOMAIN}
      STORAGE_DIR: /var/lib/megasuite/storage
      BACKUP_ENABLED: "true"
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_DIR: /var/lib/megasuite/backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Configura BACKUP_ENCRYPTION_KEY}
      PASSWORD_RESET_WEBHOOK_URL: ${PASSWORD_RESET_WEBHOOK_URL:-}
      PASSWORD_RESET_WEBHOOK_SECRET: ${PASSWORD_RESET_WEBHOOK_SECRET:-}
      ELECTRONIC_BILLING_ENCRYPTION_KEY: ${ELECTRONIC_BILLING_ENCRYPTION_KEY:?Configura ELECTRONIC_BILLING_ENCRYPTION_KEY}
    volumes:
      - megasuite_storage:/var/lib/megasuite/storage
      - megasuite_backups:/var/lib/megasuite/backups

  caddy:
    image: ghcr.io/jesus050/nubixor-proxy:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Configura APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  megasuite_pg_v2:
  megasuite_redis_v2:
  megasuite_storage:
  megasuite_backups:
  caddy_data:
  caddy_config:
